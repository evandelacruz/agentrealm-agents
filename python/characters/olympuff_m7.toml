# A16 live M7 acceptance: an hour of survival on the olympuff overworld
# (scripts/smoke_m7_olympuff.py). The smoke script adds the 150-block `goto`
# target at run time; pickup stays on so Recover can run.
world = "olympuff"

[policy]
kind = "scripted"
goals = ["explore", "doors"]
on_hostile = "flee"
hostile = ["npc"]
hostile_range = 2
pickup = true
avoid_blocks = ["fire", "lava"]
entity_refresh = 5
